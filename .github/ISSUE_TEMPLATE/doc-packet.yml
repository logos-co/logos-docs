name: Journey documentation (doc packet)
description: Request documentation for a new user journey. R&D SMEs use this form to provide the doc packet.
title: "[Journey] "
labels: ["type:journey"]
body:
  - type: markdown
    attributes:
      value: |
        **Required sections** are the minimum for the Docs team to start a draft.

        Even if you provide a draft covering the user journey, you must still fill out this form. Your draft may lack details that are important for the Docs team and the end user.

  - type: markdown
    attributes:
      value: "## Minimum required information"

  - type: markdown
    attributes:
      value: "### 1. Outcome and purpose"

  - type: dropdown
    id: journey-type
    attributes:
      label: Journey type
      description: We have identified four types of procedure docs, and so each procedure must belong to one of the following types:
      options:
        - gui user
        - cli user
        - developer
        - node operator
    validations:
      required: true

  - type: input
    id: outcome
    attributes:
      label: What the user achieves
      description: One sentence. What is the end state after completing this journey?
      placeholder: "e.g., The user has a running Logos blockchain node connected to the devnet."
    validations:
      required: true

  - type: textarea
    id: why-it-matters
    attributes:
      label: Why it matters
      description: One to two sentences. What does this enable, unblock, or prove? Why should a developer or operator care?
    validations:
      required: true

  - type: textarea
    id: key-components
    attributes:
      label: Key components
      description: List 2-5 main components or services involved in this journey. For each one, write one sentence on what it does and how it relates to the others.
      placeholder: |
        - Component A: Does X. Connects to B via Y.
        - Component B: Does Z. Receives input from A.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 2. Scope"

  - type: input
    id: repo
    attributes:
      label: Repository
      description: URL + branch, tag, or commit SHA.
      placeholder: "e.g., https://github.com/logos-co/nomos @ v0.2.0"
    validations:
      required: true

  - type: dropdown
    id: runtime-target
    attributes:
      label: Runtime target
      options:
        - local
        - devnet
        - testnet v0.1
        - testnet v0.2
        - testnet v0.3
        - testnet v0.4
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: OS, minimum hardware requirements, tools, versions, accounts, keys, tokens, or other setup the user needs before starting.
      placeholder: |
        - OS: Linux (Ubuntu 22.04+)
        - Rust 1.93+
        - 8 GB RAM, 50 GB free disk
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 3. Happy path"

  - type: textarea
    id: happy-path
    attributes:
      label: Commands and expected outputs
      description: Link to an existing document that covers these steps (for example, a `README.md` or `docs/setup.md` in your repo) or enter the commands below. Describe any UI elements, button labels or interactions if applicable. Cover the exact steps from a clean setup to a working result, with expected output or success indicators after each major step — a copy-pasted terminal session is ideal.
      render: sh
    validations:
      required: true

  - type: markdown
    attributes:
      value: "#### Journey fit checklists"

  - type: markdown
    attributes:
      value: "Navigate to the checklist that matches the journey type you selected earlier, and make sure your journey matches the criteria in that checklist. If any of the checks is false, explain why below."

  - type: checkboxes
    id: gui-user-checks
    attributes:
      label: Journey fit checklists (GUI user)
      options:
        - label: Installing though Basecamp is the only or preferred path.
        - label: App is in the default Logos catalogue.
        - label: No CLI commands required.
        - label: No build required.
        - label: Prerequisites should be obtainable in GUI (Basecamp or other).
        - label: GUI steps described exactly (e.g. give exact names for buttons to press).

  - type: checkboxes
    id: cli-user-checks
    attributes:
      label: Journey fit checklists (CLI user)
      options:
        - label: No GUI steps.
        - label: No build required (include instructions for obtaining binaries). Instructions for building from source can be included as an alternative option.
        - label: Relevant settings or config fields described.
        - label: Expected output/logs/state included.
        - label: Prerequisites should be obtainable via CLI (can link to existing docs).

  - type: checkboxes
    id: developer-checks
    attributes:
      label: Journey fit checklists (developer)
      options:
        - label: "Build target is clearly mentioned as one or more of the following:"
        - label: ↳ UI Module
        - label: ↳ Core Module
        - label: ↳ LEZ program
        - label: ↳ Standalone app using the Logos DK
        - label: Once user goes through the journey, they must have a runnable program. If necessary, include example code.
        - label: Large or non-obvious code blocks should include comments for clarity.
        - label: No missing prerequisites (can link to existing docs).
        - label: Expected output/logs/state included.
        - label: Main functionality/use cases (beyond the example) described. Can take the form of "next steps" or "use cases".
        - label: Link to core module API reference, except for LEZ program guides.
        - label: Includes error handling.
        - label: Build and deploy is described.

  - type: checkboxes
    id: node-operator-checks
    attributes:
      label: Journey fit checklists (node operator)
      options:
        - label: No GUI, CLI only.
        - label: Description of where to obtain binaries. No build step.
        - label: Prerequisites clearly mentioned (can link to existing docs).
        - label: Node start command included.
        - label: Node functionality while running described.
        - label: Relevant settings or config fields described.
        - label: Includes health checks or other verification command.
        - label: Describes how keys are stored, generated, and handled.
        - label: Instructions on how to set up a long-running node included.

  - type: textarea
    id: missing-checks
    attributes:
      label: Explanation for any missing journey fit checks
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 4. Verification"

  - type: input
    id: success-command
    attributes:
      label: Success command
      description: One command or action that proves the journey is complete.
      placeholder: "e.g., curl http://localhost:8080/cryptarchia/info"
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What the user should see when running the success command.
      render: sh
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Additional information (improves doc quality)

        The fields below help the Docs team write a higher-quality document.

  - type: markdown
    attributes:
      value: "### 5. Configuration"

  - type: textarea
    id: config
    attributes:
      label: Configuration details
      description: Required env vars, flags, config keys (name + purpose + example value), minimal working config snippet, default ports and endpoints.
      render: sh
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 6. Known issues and troubleshooting"

  - type: textarea
    id: troubleshooting
    attributes:
      label: Failure modes and limits
      description: Top 3 failure modes (symptom, cause if known, fix or workaround) and any features or workflows explicitly out of scope for this release.
      placeholder: |
        - Symptom: "epoch state is not available"
          Cause: chain_start_time too far in past
          Fix: regenerate timestamp and update config
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 7. Point of contact"

  - type: input
    id: poc-github
    attributes:
      label: GitHub handle
      description: GitHub username of the Logos R&D point of contact for this journey.
      placeholder: "e.g., @username"
    validations:
      required: true

  - type: input
    id: poc-discord
    attributes:
      label: Discord handle
      description: Discord username of the Logos R&D point of contact for this journey.
      placeholder: "e.g., username"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 8. Additional context"

  - type: textarea
    id: existing-docs
    attributes:
      label: Existing docs or specs
      description: Links to READMEs, Notion pages, specs, diagrams, or any supplementary material (drafts, recorded demos, walkthroughs).
    validations:
      required: false

  - type: textarea
    id: hardware
    attributes:
      label: Hardware requirements
      description: If this is a node or client journey, list CPU, RAM, disk, and network requirements.
    validations:
      required: false

  - type: input
    id: time-estimate
    attributes:
      label: Estimated time to complete
      description: Rough happy-path duration.
      placeholder: "e.g., 15-20 minutes"
    validations:
      required: false

  - type: textarea
    id: security-notes
    attributes:
      label: Security notes
      description: Anything that could cause data loss, key leakage, or irreversible actions.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Reminder:** Completing this doc packet starts the documentation process. For more information, see the [contributing guide](../../CONTRIBUTING.md).