name: Build Check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      # Agent-facing output: llms.txt, .md pages, docs.json, AGENTS.md (plugins/agent-ready).
      - run: node scripts/check-agent-artifacts.mjs
      # Docs MCP server, tested against the build above.
      - run: npm ci --prefix mcp-server
      - run: npm test --prefix mcp-server
