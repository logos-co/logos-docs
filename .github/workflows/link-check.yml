name: Link Check

# PR gate. Checks INTERNAL links only (relative paths and heading anchors)
# across the whole repo, offline. No network, so no token, no cache, and none
# of the external-link false positives (429s, Cloudflare, timeouts).
# Fast and deterministic: every red X is a broken path or a stranded anchor
# the author can fix. External links are handled by link-check-external.yml.

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --extensions md
            .
          fail: true
