name: Sync API reference

# Mirrors reference pages from other repos into each docs section's reference/
# folder, from each repo's latest GitHub release (scripts/sync-api-reference/
# sync.py): the Delivery, Chat and Storage module API references, the logosctl
# manual, the Scaffold command reference and the module builder CMake and Nix
# references. Opens or updates one PR when the result differs from what is
# committed. Runs daily; a module's Sphinx docs reach its gh-pages branch a few
# minutes after the release, so a release lands here by the next run at the
# latest.

on:
  workflow_dispatch:        # manual "Run workflow" button (needs the file on the default branch)
    inputs:
      source:
        description: Source to sync
        type: choice
        options: [all, delivery, chat, storage, logosctl, scaffold, module-builder-cmake, module-builder-nix]
        default: all
      tag:
        description: Release tag to sync instead of the latest (one source only), e.g. v0.3.3
        type: string
        default: ''
  schedule:
    - cron: "23 5 * * *"    # Daily, 05:23 UTC.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-api-reference
  cancel-in-progress: false

jobs:
  sync:
    # Forks would otherwise open sync PRs against themselves every day.
    if: github.repository == 'logos-co/logos-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r scripts/sync-api-reference/requirements.txt

      - name: Regenerate the mirrored pages
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          TAG: ${{ inputs.tag }}
        run: |
          args=()
          if [ -n "$SOURCE" ] && [ "$SOURCE" != all ]; then args+=("$SOURCE"); fi
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          python3 scripts/sync-api-reference/sync.py "${args[@]}"

      # PRs opened with the default GITHUB_TOKEN do not trigger other
      # workflows, so Build Check and Vale would not run on them. A
      # DOCS_SYNC_TOKEN secret (a fine-grained token with contents and pull
      # requests write on this repo) avoids that; without it, close and reopen
      # the PR to start the checks.
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
          branch: sync/api-reference
          delete-branch: true
          sign-commits: true
          add-paths: |
            docs/messaging/reference/delivery-module-api-reference.md
            docs/messaging/reference/chat-module-api-reference.md
            docs/storage/reference/storage-module-api-reference.md
            docs/core/reference/logos-cli-reference.md
            docs/build-an-app/scaffold/reference/logos-scaffold-command-reference.md
            docs/core/reference/module-builder-cmake-reference.md
            docs/core/reference/module-builder-nix-api-reference.md
          commit-message: |
            docs: sync mirrored reference pages

            Delivery: ${{ steps.sync.outputs.delivery || 'not synced' }}
            Chat: ${{ steps.sync.outputs.chat || 'not synced' }}
            Storage: ${{ steps.sync.outputs.storage || 'not synced' }}
            logosctl: ${{ steps.sync.outputs.logosctl || 'not synced' }}
            Scaffold: ${{ steps.sync.outputs.scaffold || 'not synced' }}
            Module builder CMake: ${{ steps.sync.outputs.module_builder_cmake || 'not synced' }}
            Module builder Nix: ${{ steps.sync.outputs.module_builder_nix || 'not synced' }}
          title: "docs: sync mirrored reference pages"
          body: |
            Regenerated by `.github/workflows/sync-api-reference.yml` from each source repo's latest release:

            | Page | Source | Release |
            | --- | --- | --- |
            | Delivery module API reference | [`logos-delivery-module`](https://github.com/logos-co/logos-delivery-module/releases) | ${{ steps.sync.outputs.delivery || 'not synced' }} |
            | Chat module API reference | [`logos-chat-module`](https://github.com/logos-co/logos-chat-module/releases) | ${{ steps.sync.outputs.chat || 'not synced' }} |
            | Storage module API reference | [`logos-storage-module`](https://github.com/logos-co/logos-storage-module/releases) | ${{ steps.sync.outputs.storage || 'not synced' }} |
            | Logos CLI reference | [`logos-logoscore-cli`](https://github.com/logos-co/logos-logoscore-cli/releases) | ${{ steps.sync.outputs.logosctl || 'not synced' }} |
            | Logos Scaffold command reference | [`scaffold`](https://github.com/logos-co/scaffold/releases) | ${{ steps.sync.outputs.scaffold || 'not synced' }} |
            | Module builder CMake reference | [`logos-module-builder`](https://github.com/logos-co/logos-module-builder/releases) | ${{ steps.sync.outputs.module_builder_cmake || 'not synced' }} |
            | Module builder Nix API reference | [`logos-module-builder`](https://github.com/logos-co/logos-module-builder/releases) | ${{ steps.sync.outputs.module_builder_nix || 'not synced' }} |

            The pages are mirrored, so review the diff for the change itself rather than the wording; wording is fixed in the source repo.
            If no checks have run on this PR, close and reopen it to start them.
