name: Sync API reference

# Mirrors the Delivery, Chat and Storage module API references into docs/ from
# each module's latest GitHub release (scripts/sync-api-reference/sync.py), and
# opens or updates one PR when the result differs from what is committed.
# Runs daily; a module's docs reach its gh-pages branch a few minutes after the
# release, so a release lands here by the next run at the latest.

on:
  workflow_dispatch:        # manual "Run workflow" button (needs the file on the default branch)
    inputs:
      module:
        description: Module to sync
        type: choice
        options: [all, delivery, chat, storage]
        default: all
      tag:
        description: Release tag to sync instead of the latest (one module only), e.g. v0.3.3
        type: string
        default: ''
  schedule:
    - cron: "23 5 * * *"    # Daily, 05:23 UTC.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-api-reference
  cancel-in-progress: false

jobs:
  sync:
    # Forks would otherwise open sync PRs against themselves every day.
    if: github.repository == 'logos-co/logos-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r scripts/sync-api-reference/requirements.txt

      - name: Regenerate the mirrored pages
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODULE: ${{ inputs.module }}
          TAG: ${{ inputs.tag }}
        run: |
          args=()
          if [ -n "$MODULE" ] && [ "$MODULE" != all ]; then args+=("$MODULE"); fi
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          python3 scripts/sync-api-reference/sync.py "${args[@]}"

      # PRs opened with the default GITHUB_TOKEN do not trigger other
      # workflows, so Build Check and Vale would not run on them. A
      # DOCS_SYNC_TOKEN secret (a fine-grained token with contents and pull
      # requests write on this repo) avoids that; without it, close and reopen
      # the PR to start the checks.
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
          branch: sync/api-reference
          delete-branch: true
          sign-commits: true
          add-paths: |
            docs/messaging/delivery/delivery-module-api-reference.md
            docs/messaging/chat-module/chat-module-api-reference.md
            docs/storage/storage-module-api-reference.md
          commit-message: |
            docs: sync module API references

            Delivery: ${{ steps.sync.outputs.delivery || 'not synced' }}
            Chat: ${{ steps.sync.outputs.chat || 'not synced' }}
            Storage: ${{ steps.sync.outputs.storage || 'not synced' }}
          title: "docs: sync module API references"
          body: |
            Regenerated by `.github/workflows/sync-api-reference.yml` from each module's latest release:

            | Module | Release |
            | --- | --- |
            | [`logos-delivery-module`](https://github.com/logos-co/logos-delivery-module/releases) | ${{ steps.sync.outputs.delivery || 'not synced' }} |
            | [`logos-chat-module`](https://github.com/logos-co/logos-chat-module/releases) | ${{ steps.sync.outputs.chat || 'not synced' }} |
            | [`logos-storage-module`](https://github.com/logos-co/logos-storage-module/releases) | ${{ steps.sync.outputs.storage || 'not synced' }} |

            The pages are generated, so review the diff for the API change itself rather than the wording; wording is fixed in the module repo.
            If no checks have run on this PR, close and reopen it to start them.
