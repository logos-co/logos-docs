name: Vale
on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '.vale.ini'
      - '.github/styles/**'

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1    

      - uses: actions/cache@v5
        with:
          path: .github/styles 
          key: vale-styles-${{ hashFiles('.vale.ini') }}

      - uses: errata-ai/vale-action@reviewdog
        with:
          version: 3.11.1
          files: docs
          reporter: github-pr-check
          filter_mode: added
          fail_on_error: true
