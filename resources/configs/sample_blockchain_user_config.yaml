# P2P networking (libp2p) used for blocks, transactions, and peer discovery.
network:
  backend:
    swarm:
      # IPv4 address and UDP port the node listens on for QUIC. Port 0 picks a random port.
      host: 0.0.0.0
      port: 3000
      # Ed25519 secret key of the node's libp2p identity (its peer ID), in hex.
      # From the NetworkSwarm key in keystore.yaml.
      node_key: 29e0b57939416954d4d739e8b5da733d73249c6c5e6f84dff534d5c15ba33cf9
      # Gossipsub, the protocol that broadcasts blocks and transactions.
      # These are libp2p gossipsub parameters; change them only if you know the protocol.
      gossipsub:
        history_length: 5            # Heartbeats of messages kept for gossip
        history_gossip: 3            # Heartbeats of messages advertised in gossip
        mesh_n: 6                    # Target number of mesh peers per topic
        mesh_n_low: 5                # Add mesh peers below this
        mesh_n_high: 12              # Remove mesh peers above this
        retain_scores: 4             # Heartbeats to keep scores of disconnected peers
        gossip_lazy: 6               # Minimum peers to gossip to
        gossip_factor: 0.25          # Share of peers to gossip to
        heartbeat_initial_delay: 5s
        heartbeat_interval: 1s
        fanout_ttl: 1m               # How long to keep fanout state for topics we publish to but do not join
        check_explicit_peers_ticks: 300
        duplicate_cache_time: 1day   # How long seen message IDs are remembered, so a re-broadcast is not propagated again
        validate_messages: false
        allow_self_origin: false
        do_px: false                 # Peer exchange on prune
        prune_peers: 0
        prune_backoff: 1m
        unsubscribe_backoff: 10s
        backoff_slack: 1
        flood_publish: true          # Publish own messages to all peers, not only the mesh
        graft_flood_threshold: 10s
        mesh_outbound_min: 2
        opportunistic_graft_ticks: 60
        opportunistic_graft_peers: 2
        gossip_retransimission: 3
        max_messages_per_rpc: null   # null: no limit
        max_ihave_length: 5000
        max_ihave_messages: 10
        iwant_followup_time: 3s
        published_message_ids_cache_time: 10s
      # Kademlia DHT, used for peer discovery. null uses the libp2p default.
      kademlia:
        query_timeout: null          # Timeout for a single query
        replication_factor: null     # Replication factor for records
        parallelism: null            # Parallelism of iterative queries
        disjoint_query_paths: null   # Require iterative queries to use disjoint paths
        max_packet_size: null        # Maximum size of a Kademlia packet
        kbucket_inserts: null        # k-bucket insertion strategy: OnConnected or Manual
        cache_size: 1                # How many peers closest to a key cache its record; null disables caching
        periodic_bootstrap_interval: null  # Interval of periodic bootstrap; 0s disables it
      # Identify, which exchanges addresses and protocols with connected peers. null uses the libp2p default.
      identify:
        agent_version: null          # Agent version string to advertise
        interval: null               # Interval between identify pushes
        push_listen_addr_updates: null  # Push identify to all peers when listen addresses change
        cache_size: null             # Number of discovered peers to keep
        hide_listen_addrs: true      # Share only external addresses, not listen addresses
      # Block download protocol between nodes.
      chain_sync:
        peer_response_timeout: 5s    # Maximum wait for each message from a peer
        max_inbound_requests: 10     # Block download requests served at once
        inbound_download_stream_timeout: 2m  # Maximum time to serve one block download stream
      # How the node finds and announces its public address.
      # type: traversal uses AutoNAT, port mapping (UPnP / NAT-PMP / PCP), and gateway monitoring.
      # For a node with a fixed public IP, use instead:
      #   nat:
      #     type: static
      #     external_address: /ip4/<public-ip>/udp/3000/quic-v1
      nat:
        type: traversal
        autonat:
          max_candidates: null       # Most address candidates to test; null uses the libp2p default
          probe_interval: null       # Interval between tests of new candidates; null uses the libp2p default
          retest_successful_external_addresses_interval: 1m  # How often to recheck a confirmed external address
        mapping:
          timeout: 1s                # Timeout for a request to the gateway
          lease_duration: 2h         # Lease requested for a port mapping
          max_retries: 3             # Attempts per mapping request
          renewal_delay_fraction: 0.8  # Renew a mapping after this share of its lease
          retry_interval: 30s        # Wait before retrying a failed mapping
        gateway_monitor:
          check_interval: 5m         # How often to check for a changed gateway address
    # Peers to connect to on startup. Generated from peers.json.
    initial_peers:
    - /ip4/65.109.51.37/udp/3000/quic-v1/p2p/12D3KooWFrouXfmrR4nsLMtE7wu15DoMJ6VtoUtHinREZCvbWHar
    - /ip4/65.109.51.37/udp/3001/quic-v1/p2p/12D3KooWJRGau8M1rjT7R5e4YYsgdFhsMX35nRDtMwCDjxQkXAHz
    - /ip4/65.109.51.37/udp/3002/quic-v1/p2p/12D3KooWQXJavMDTRscjauFSgVAB1VLB6Rzpy2uY5SU9Tk7927tb
    - /ip4/65.109.51.37/udp/50001/quic-v1/p2p/12D3KooWSQc7CcGtvWDPF1yCbBthFnQjprfCVHmfmNDUrSmqQsU1
# Blend Network. Used once the node joins it as a core node.
blend:
  # Key ID of the BlendSigning key, the signing key registered in the node's Blend declaration.
  non_ephemeral_signing_key_id: d66f3b05b9d62cf8d11d247b04afb386140485afc145ff01014ae40888077f59
  core:
    backend:
      # Address of the Blend listener. Open this UDP port when you join the Blend Network.
      listening_address: /ip4/0.0.0.0/udp/3400/quic-v1
      max_dial_attempts_per_peer: 3  # Dial attempts before giving up on a Blend peer
      peering_degree_check_interval: 1m  # How often to check the number of Blend peers and dial more if needed
    zk:
      # Key ID of the BlendZk key, which holds the note locked for the Blend declaration.
      secret_key_kms_id: 20ec7228a837e396e045ec8843e2bad09fd645fa0903a1c6e38c6dcce7e5ec17
  edge:
    backend:
      max_dial_attempts_per_peer_per_message: 1  # Dial attempts per message sent through a Blend node
      replication_factor: 1          # Blend nodes each message is sent to
  # true: do not fall back to broadcasting messages that Blend failed to deliver.
  abstain_on_failure: false
# Consensus (Cryptarchia).
cryptarchia:
  service:
    bootstrap:
      # After Initial Block Download, how long the node stays in Bootstrapping before going Online.
      prolonged_bootstrap_period: 1h
      # true: start in Bootstrapping even when the node has state past genesis.
      force_bootstrap: false
      offline_grace_period:
        grace_period: 20m            # A node offline for longer than this starts in Bootstrapping again
        state_recording_interval: 1m # How often the node records its time and state for this check
    sync:
      block_provider:
        batch_size: 1000             # Most blocks sent per request to a peer that is syncing from this node
  network:
    bootstrap:
      # Initial Block Download (IBD): how the node catches up when it starts.
      ibd:
        # Peer IDs to ask for the chain tip. Generated from the peer IDs in peers.json.
        peers:
        - 12D3KooWFrouXfmrR4nsLMtE7wu15DoMJ6VtoUtHinREZCvbWHar
        - 12D3KooWJRGau8M1rjT7R5e4YYsgdFhsMX35nRDtMwCDjxQkXAHz
        - 12D3KooWQXJavMDTRscjauFSgVAB1VLB6Rzpy2uY5SU9Tk7927tb
        - 12D3KooWSQc7CcGtvWDPF1yCbBthFnQjprfCVHmfmNDUrSmqQsU1
        delay_before_new_download: 10s  # No longer used
        tips_fetch_max_attempts: 3   # Attempts to fetch the tip from each IBD peer
        tips_fetch_min_delay: 250ms  # Lower bound of the backoff between attempts
        tips_fetch_max_delay: 1s     # Upper bound of the backoff between attempts
        round_delay: 1s              # Delay between IBD rounds
    sync:
      orphan:
        max_orphan_cache_size: 1000  # Blocks kept while their parents are downloaded
        max_rejected_cache_size: 1000  # Rejected block IDs remembered so they are not downloaded again; 0 disables
      tip_poll:
        enabled: true                # Poll peers for their tip when the node falls behind
        lag_threshold_blocks: 3      # Poll when the tip lags this many expected blocks behind the current slot
        max_peers_to_sample: 5       # Peers asked on each poll
    network:
      max_connected_peers_to_try_download: 16   # Connected peers tried when downloading a block
      max_discovered_peers_to_try_download: 16  # Discovered peers tried when downloading a block
    seen_items_subscription_channel_size: 64
  leader:
    wallet:
      max_tx_fee: 18446744073709551615  # Highest fee the leader pays for its own transactions; this default sets no limit
      # Public key of the LeaderFunding key.
      funding_pk: 6d7299756057b9d4903a05e88cf86140ffad8a101680251c5706148a89fd9a14
# Clock synchronisation over NTP.
time:
  backend:
    server: pool.ntp.org:123
    client:
      timeout: 5s
      listening_interface: 0.0.0.0
    update_interval: 15s             # How often to contact the NTP server
# Service declarations (SDP), such as the Blend declaration.
sdp:
  # A service declaration the node already made, to resume after a restart:
  # provider_id, zk_id, locators, and service_type. null: none in the config.
  declaration: null
  wallet:
    max_tx_fee: 18446744073709551615  # Highest fee paid for SDP transactions; this default sets no limit
    # Public key of the SdpFunding key, which pays for SDP transactions.
    funding_pk: aa46382897b011a7aeb463eb61d55b4cb52521945c44b7d9ef4e67ade72ee110
  active_message_tracker:
    status_check_interval_in_tip_changes: 3  # Tip changes between checks of a submitted activity message
# Local HTTP API.
api:
  backend:
    listen_address: 127.0.0.1:8080   # Keep it on 127.0.0.1 unless you protect it
    cors_origins: []
    timeout: 30s
    max_body_size: 10485760          # Bytes
    max_concurrent_requests: 500
# Block database.
storage:
  backend:
    folder_name: ./db                # Relative to state.base_folder
    read_only: false
    column_family: blocks
# Key management.
kms:
  # Keystore path, relative to user_config.yaml. When it exists, node_key, the key IDs,
  # wallet, and kms are read from it, and user_config.yaml only overrides them.
  keystore: keystore.yaml
  backend:
    # Every key from keystore.yaml, by key ID, with its secret key.
    keys:
      6d7299756057b9d4903a05e88cf86140ffad8a101680251c5706148a89fd9a14: !Zk 1789dcce3b54513dee33949f1df5faddb25223d00a6152eacf4e81aa99eda405      # LeaderFunding
      8e7bc34ed67650847e1230902724820a2eaa280d7dce9731a3bd6c230cf0d108: !Zk 68e696d8f361ab1e7804a2e603fbe27c9e7c8f974b9c155e9d298b6e56b75c27      # Stake
      20ec7228a837e396e045ec8843e2bad09fd645fa0903a1c6e38c6dcce7e5ec17: !Zk 8df24a369c861b09af3f3b7aa3bc906a5fe6887345c9bf55ca88e29a1c8ad01a      # BlendZk
      cc74387c864f6a47c212f60115c0cacf1e7e11c578761af0d5f901c75ff48903: !Zk 2ae34ef989943bebebf101331276a7d46f8738bbd474d5fca98d00d32134091f      # VaucherMaster
      6f43014a18add18bb1faab059c08500df232d4086162f3a8b944f3f346f9cd18: !Zk 31c4d35e1872792aa5657232b26906949f9d96ad9a3fe7d4e524a8bad4889818      # PoWClaim
      aa46382897b011a7aeb463eb61d55b4cb52521945c44b7d9ef4e67ade72ee110: !Zk 0a62df8ed79e76919dfd7a9c7d3e6fb6422ddfe0129e9c841350e64e2a33ab2c      # SdpFunding
      d66f3b05b9d62cf8d11d247b04afb386140485afc145ff01014ae40888077f59: !Ed25519 2db83159be41be189e41d4956f9a4eca58b020da4834730bedf3124a6d287dcd  # BlendSigning
      3ae4efd339acb0ce0777314d36b9304ea036c07577fb10267ee20fb616902148: !Ed25519 29e0b57939416954d4d739e8b5da733d73249c6c5e6f84dff534d5c15ba33cf9  # NetworkSwarm
# Pending transactions.
mempool:
  tx_ttl: 9h                         # How long a transaction can wait before it is dropped; null keeps it until included
  seen_items_subscription_channel_size: 64
  pow_claim_grace_slots: 0           # Slots a PoW claim stays after its acceptance window closes
# Wallet.
wallet:
  # Every Zk key from keystore.yaml, by key ID. The wallet tracks the notes they hold.
  known_keys:
    6d7299756057b9d4903a05e88cf86140ffad8a101680251c5706148a89fd9a14: 6d7299756057b9d4903a05e88cf86140ffad8a101680251c5706148a89fd9a14  # LeaderFunding
    8e7bc34ed67650847e1230902724820a2eaa280d7dce9731a3bd6c230cf0d108: 8e7bc34ed67650847e1230902724820a2eaa280d7dce9731a3bd6c230cf0d108  # Stake
    20ec7228a837e396e045ec8843e2bad09fd645fa0903a1c6e38c6dcce7e5ec17: 20ec7228a837e396e045ec8843e2bad09fd645fa0903a1c6e38c6dcce7e5ec17  # BlendZk
    cc74387c864f6a47c212f60115c0cacf1e7e11c578761af0d5f901c75ff48903: cc74387c864f6a47c212f60115c0cacf1e7e11c578761af0d5f901c75ff48903  # VaucherMaster
    6f43014a18add18bb1faab059c08500df232d4086162f3a8b944f3f346f9cd18: 6f43014a18add18bb1faab059c08500df232d4086162f3a8b944f3f346f9cd18  # PoWClaim
    aa46382897b011a7aeb463eb61d55b4cb52521945c44b7d9ef4e67ade72ee110: aa46382897b011a7aeb463eb61d55b4cb52521945c44b7d9ef4e67ade72ee110  # SdpFunding
  # Key ID of the VaucherMaster key, used for leader-reward vouchers.
  voucher_master_key_id: cc74387c864f6a47c212f60115c0cacf1e7e11c578761af0d5f901c75ff48903
  pending_note_expiry_blocks: 10     # Immutable blocks after which a note reserved by an unconfirmed transaction can be spent again
# Proof-of-work mining and reward claiming.
pow:
  mining:
    max_threads: 1                   # CPU threads used for mining; null uses one per core
    max_tickets_per_block: 1
  auto_claim:
    # Keys that auto-claim pays, each up to its threshold. Empty turns auto-claim off.
    targets:
    - public_key: 6f43014a18add18bb1faab059c08500df232d4086162f3a8b944f3f346f9cd18  # PoWClaim
      threshold: 2000000000          # Balance, in tokens, to pay this key up to
    tick:                            # Period between claim attempts: unit is seconds or slots
      unit: seconds
      value: 10
# Logs, traces, and metrics.
tracing:
  logger:
    file:
      directory: .                   # Relative to the node's working directory
      prefix: null                   # null names the files logos-blockchain.log.<date-hour>
      appender_type: !Rolling
        rotation: Hourly
        retention: !MaxFiles
          max_files: 10              # Keeps the last 10 hourly files
        compression: None
    loki: null                       # Grafana Loki: endpoint and host_identifier
    gelf: null                       # Graylog GELF: addr
    otlp: null                       # OpenTelemetry logs: endpoint, service_name, authorization_header, protocol
    format: !Text Ansi               # !Text Ansi, !Text NoAnsi, or Json
    stdout: true
    stderr: false
  tracing: None                      # OpenTelemetry traces: !Otlp with endpoint, sample_ratio, service_name, ...
  # Per-target log levels. Derived from level when not set.
  filter: !Env
    filters:
      '*': WARN
      logos_blockchain: INFO
      libp2p_gossipsub: ERROR
      h2: WARN
      hyper: WARN
      hyper_util: WARN
      opentelemetry: WARN
      opentelemetry_sdk: WARN
      reqwest: WARN
      rustls: WARN
      tonic: WARN
      tower: WARN
  metrics:
    otlp: null                       # OpenTelemetry metrics export
    open_metrics:
      enabled: true                  # Serve metrics through the module's collectOpenMetricsText call
  console: None                      # tokio-console: !Console with bind_address and port
  level: INFO                        # Log level of the node's own logs
# Node state.
state:
  base_folder: ./state               # Relative to the node's working directory